<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>TTS-instellingen</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 36em; margin: 2em auto; }
    label { display: block; margin: .8em 0; }
    fieldset { margin: 1em 0; border-radius: 6px; }
    #saved { color: #2e7d32; }
  </style>
</head>
<body>
  <h1>Voorlees-instellingen</h1>
  <label>Standaardsnelheid
    <select id="rate">
      <option value="0.5">0,5×</option>
      <option value="0.75">0,75×</option>
      <option value="1">1×</option>
      <option value="1.25">1,25×</option>
      <option value="1.5">1,5×</option>
      <option value="2">2×</option>
    </select>
  </label>
  <fieldset>
    <legend>Stem per taal</legend>
    <div id="voices"></div>
  </fieldset>
  <fieldset>
    <legend>Engine</legend>
    <label><input type="radio" name="pref" value="cloud" checked> Cloud (Edge TTS — mooiste stemmen)</label>
    <label><input type="radio" name="pref" value="local"> Lokaal (Piper — offline, eigen stemmen)</label>
    <label><input type="radio" name="pref" value="local-first"> Lokaal eerst, cloud als reserve</label>
  </fieldset>
  <fieldset>
    <legend>Lokale helper</legend>
    <p id="helper-status">Helper-status wordt opgehaald…</p>
  </fieldset>
  <p id="saved" hidden>Opgeslagen ✓</p>
  <script src="options.js"></script>
</body>
</html>
