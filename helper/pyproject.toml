[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-lnx-helper"
version = "0.3.0"
description = "Lokale TTS-helper voor de TTS LNX Browser Firefox-extensie (Edge-proxy + Piper)"
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Sir-hack-a-lot/tts-lnx-browser"
Issues = "https://github.com/Sir-hack-a-lot/tts-lnx-browser/issues"

[project.scripts]
tts-lnx-helper = "tts_lnx_helper.__main__:main"
tts-lnx-helper-autostart = "tts_lnx_helper.autostart:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tts_lnx_helper*"]
